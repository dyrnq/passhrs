[package]
name = "passhrs"
version = "1.0.7"
edition = "2021"
repository = "https://github.com/dyrnq/passhrs"
license = "MIT"
description = "SSH automation tool (russh-based, ssh-compatible CLI)"

[dependencies]
russh = { version = "0.63", default-features = false, features = ["rsa", "ring", "flate2"] }
ssh-key = "0.7.0-rc.10"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
shell-escape = "0.1"
term_size = "0.3"
dirs = "6"
bytes = "1"
# futures is needed for channel read polling
futures = "0.3"
russh-sftp = "2.3.0"
# Trial: use russh-config 0.58 against russh 0.63. Both are from the
# same warp-tech monorepo but version-locking has slipped (russh is
# ahead). Trial compile: if `cargo check` passes we adopt; if not we
# fork a tiny patch or fall back to writing the parser from scratch.
russh-config = "0.58"
# Glob expansion for `Include <pattern>` directives in ssh_config.
# russh-config already depends on globset 0.4 internally; declaring
# it directly just exposes the same version we're already pulling
# in transitively (avoids a second crate download).
globset = "0.4"
# Username lookup for the `%u` token in ssh_config Include
# patterns. russh-config already pulls this in; declaring it
# directly avoids going through `std::env::var("USER")` which
# is unset on some Linux setups (e.g. systemd services).
#
# whoami 2.x made `username()` fallible (returns
# `Result<String, Error>` instead of `String`). Call sites use
# `.unwrap_or_default()` to mirror the `%d` branch's silent
# empty-on-failure style — OpenSSH similarly leaves the token
# unexpanded when the value is unavailable.
whoami = "2"
copia = { version = "0.3", features = ["async"] }
crossterm = "0.29.0"
# `libc` provides the SOL_SOCKET / SO_BINDTODEVICE constants and
# `setsockopt` symbol used by `apply_bind_interface` (Linux-only).
# Already a transitive dep of `tokio`/`russh`; declaring it
# directly avoids an unsafe `extern "C"` block in src/ssh.rs.
libc = "0.2"
